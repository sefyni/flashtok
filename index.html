<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>FlashTok</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlashTok">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/auto-render.min.js"></script>
<style>
  :root { --nav:56px; --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
    --red:#fe2c55; --cyan:#25f4ee; --yellow:#face15; --green:#2fd27a; --muted:rgba(255,255,255,.6); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#000; color:#fff; overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-user-select:none; user-select:none; }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  svg.i { width:100%; height:100%; display:block; }

  /* ---------- feed ---------- */
  #stage { position:fixed; inset:0 0 calc(var(--nav) + var(--sb)) 0; overflow:hidden; }
  #feed { position:absolute; inset:0; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; transition:transform .28s ease, opacity .28s ease; }
  #feed::-webkit-scrollbar { display:none; }
  #feed.out-l { transform:translateX(-30%); opacity:0; } #feed.out-r { transform:translateX(30%); opacity:0; }
  #feed.in-l { transform:translateX(30%); opacity:0; transition:none; } #feed.in-r { transform:translateX(-30%); opacity:0; transition:none; }
  .slide { position:relative; height:100%; scroll-snap-align:start; scroll-snap-stop:always; overflow:hidden;
    background: radial-gradient(120% 80% at 50% 0%, var(--c1) 0%, transparent 60%), radial-gradient(120% 80% at 50% 100%, var(--c2) 0%, #000 70%); }
  .slide::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.45) 0, transparent 18%, transparent 62%, rgba(0,0,0,.7) 100%); }
  .content { position:absolute; left:16px; right:78px; top:calc(var(--st) + 64px); bottom:160px; perspective:1600px; z-index:1; }
  .inner { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.2,1); }
  .slide.flipped .inner { transform:rotateY(180deg); }
  .slide.flipped .front, .slide:not(.flipped) .back { pointer-events:none; }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .back { transform:rotateY(180deg); background:rgba(14,14,20,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:22px; border:1px solid rgba(255,255,255,.1); padding:22px 20px; align-items:stretch; text-align:left;
    justify-content:flex-start; overflow-y:auto; -webkit-user-select:text; user-select:text; }
  .pill { font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.16); margin-bottom:18px; }
  .pill.new { background:var(--cyan); color:#000; } .pill.due { background:var(--yellow); color:#000; }
  .term { font-size:clamp(30px,9vw,46px); font-weight:900; line-height:1.08; text-shadow:0 4px 30px rgba(0,0,0,.4); }
  .tap { margin-top:26px; font-size:13px; color:var(--muted); }
  .schemabox { width:100%; background:#fff; border-radius:20px; padding:14px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .schemabox svg, .schemabox img { width:100%; height:auto; display:block; max-height:50vh; object-fit:contain; }
  .schematitle { font-size:22px; font-weight:800; margin-top:18px; }
  .back h4 { font-size:12px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin:16px 0 8px; }
  .back h4:first-child { margin-top:0; }
  .back .txt { font-size:18px; line-height:1.5; } .back .txt p + p { margin-top:8px; }
  .back .schemabox { padding:10px; }
  .schemabox { position:relative; }
  .schemabox .zoom { position:absolute; right:8px; bottom:8px; width:36px; height:36px; border-radius:50%; border:0; background:rgba(0,0,0,.6); display:grid; place-items:center; cursor:pointer; }
  .fitem .sch img { cursor:zoom-in; }
  #zoomv { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.94); display:none; overflow:auto; -webkit-overflow-scrolling:touch; }
  #zoomv.on { display:block; }
  #zoomv .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; padding:56px 0 40px; box-sizing:border-box; }
  #zoomv img { display:block; width:100%; height:auto; background:#fff; cursor:zoom-in; }
  #zoomv.big .wrap { display:block; }
  #zoomv.big img { width:260%; max-width:none; cursor:zoom-out; }
  #zoomv .x { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:10px; width:44px; height:44px; border:0; border-radius:50%; background:rgba(255,255,255,.12); display:grid; place-items:center; z-index:2; }
  #zoomv .zh { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 10px); text-align:center; color:#bbb; font-size:13px; pointer-events:none; }
  .rate { display:flex; gap:10px; margin-top:auto; padding-top:18px; }
  .rate button { flex:1; padding:13px; border-radius:12px; font-weight:800; font-size:15px; }
  .rate .r-ko { background:rgba(250,206,21,.18); color:var(--yellow); } .rate .r-ok { background:rgba(254,44,85,.2); color:#ff6b88; }

  /* rail */
  .rail { position:absolute; right:8px; bottom:160px; z-index:3; width:62px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .avatar { width:48px; height:48px; border-radius:50%; border:2px solid #fff; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:800; background:linear-gradient(135deg,var(--c1),var(--c2)); position:relative; margin-bottom:8px; }
  .avatar::after { content:"›"; position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); width:20px; height:20px; border-radius:50%;
    background:var(--red); font-size:16px; line-height:19px; text-align:center; font-weight:800; }
  .act { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .act .ic { width:36px; height:36px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); transition:transform .15s; }
  .act:active .ic { transform:scale(.8); }
  .act.on-ok .ic { color:var(--red); } .act.on-ko .ic { color:var(--yellow); }
  .disc { width:46px; height:46px; border-radius:50%; background:conic-gradient(#222,#444,#222,#444,#222); border:8px solid #161616;
    display:flex; align-items:center; justify-content:center; animation:spin 5s linear infinite; font-size:13px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .disc { animation-play-state:paused; position:relative; }
  body.music-on .disc { animation-play-state:running; }
  .disc::after { content:""; position:absolute; right:-12px; bottom:-8px; width:15px; height:15px; background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M11%205%206%209H2v6h4l5%204V5zM22%209l-6%206M16%209l6%206%22/%3E%3C/svg%3E") center/contain no-repeat; opacity:.8; }
  body.music-on .disc::after { background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M9%2018V5l12-2v13%22/%3E%3Ccircle%20cx%3D%226%22%20cy%3D%2218%22%20r%3D%223%22/%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%2216%22%20r%3D%223%22/%3E%3C/svg%3E"); opacity:1; animation:floatn 2s ease-in-out infinite; }
  @keyframes floatn { 50% { transform:translate(-4px,-8px) rotate(-15deg); opacity:.6; } }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { padding:9px 14px; border-radius:999px; background:#1d1d1d; font-weight:700; font-size:14px; }
  .chips button.on { background:#fff; color:#000; }
  .setrow { display:flex; align-items:center; gap:12px; margin-top:14px; font-size:14px; }
  .setrow input[type=range] { flex:1; accent-color:var(--red); }
  .switch { width:50px; height:30px; border-radius:15px; background:#333; position:relative; flex:none; transition:background .2s; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .2s; }
  .switch.on { background:var(--red); } .switch.on::after { transform:translateX(20px); }

  .cap { position:absolute; left:14px; right:84px; bottom:16px; z-index:3; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  .cap .user { font-weight:800; font-size:16px; margin-bottom:5px; }
  .cap .mast { font-size:12px; color:rgba(255,255,255,.8); margin-bottom:5px; letter-spacing:.02em; }
  .cap .mast b { color:var(--cyan); letter-spacing:1px; }
  .cap .desc { font-size:15px; line-height:1.35; } .cap .tags { font-weight:700; }
  .cap .sound { margin-top:7px; font-size:13px; display:flex; gap:6px; align-items:center; overflow:hidden; white-space:nowrap; }
  .cap .sound span { display:inline-block; animation:marquee 9s linear infinite; }
  @keyframes marquee { to { transform:translateX(-50%); } }
  .bar { position:absolute; left:0; right:0; bottom:0; height:2px; background:rgba(255,255,255,.2); z-index:3; }
  .bar i { display:block; height:100%; background:rgba(255,255,255,.85); }

  /* quiz */
  .quiz .content { right:16px; }
  .qbox { width:100%; text-align:left; }
  .qhead { display:flex; align-items:center; gap:8px; font-weight:900; font-size:13px; letter-spacing:.1em; margin-bottom:14px; }
  .qhead .live { background:var(--red); padding:4px 9px; border-radius:6px; }
  .masq { display:inline-block; background:rgba(255,255,255,.22); border-radius:5px; padding:0 7px; letter-spacing:2px; font-weight:900; }
  .qdef { background:rgba(0,0,0,.45); border-radius:18px; padding:18px; font-size:17px; line-height:1.45; margin-bottom:16px; max-height:36vh; overflow-y:auto; }
  .qopt { width:100%; text-align:left; padding:15px 16px; border-radius:14px; background:rgba(255,255,255,.14); margin-bottom:10px;
    font-size:17px; font-weight:700; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:flex; justify-content:space-between; align-items:center;
    transition:transform .15s, background .2s; }
  .qopt:active { transform:scale(.97); }
  .qopt.good { background:var(--green); } .qopt.bad { background:var(--red); animation:shake .4s; }
  .qopt .pct { font-size:13px; opacity:.85; }
  @keyframes shake { 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-4px)} }
  .qwho { font-size:13px; color:var(--muted); margin-top:4px; }

  /* overlays */
  .heart { position:absolute; z-index:6; pointer-events:none; width:110px; height:110px; color:var(--red); animation:heart .9s ease-out forwards; filter:drop-shadow(0 6px 20px rgba(0,0,0,.4)); }
  @keyframes heart { 0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r));opacity:0} 15%{transform:translate(-50%,-50%) scale(1.2) rotate(var(--r));opacity:1}
    30%{transform:translate(-50%,-50%) scale(.95) rotate(var(--r))} 100%{transform:translate(-50%,-150%) scale(1.4) rotate(var(--r));opacity:0} }
  .xpf { position:fixed; z-index:40; pointer-events:none; font-weight:900; font-size:20px; color:var(--yellow); text-shadow:0 2px 8px rgba(0,0,0,.6); animation:xpf 1s ease-out forwards; }
  @keyframes xpf { from { transform:translate(-50%,0); opacity:1; } to { transform:translate(-50%,-70px); opacity:0; } }
  #combo { position:fixed; top:calc(var(--st) + 62px); left:50%; transform:translateX(-50%); z-index:21; pointer-events:none;
    font-weight:900; font-size:15px; padding:6px 14px; border-radius:999px; background:linear-gradient(90deg,#ff8a00,var(--red)); box-shadow:0 4px 20px rgba(254,44,85,.5);
    opacity:0; transition:opacity .25s; white-space:nowrap; }
  #combo.show { opacity:1; } #combo.bump { animation:bump .35s; }
  @keyframes bump { 40% { transform:translateX(-50%) scale(1.25); } }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:60; }
  .banner { position:fixed; left:12px; right:12px; top:calc(var(--st) + 10px); z-index:55; border-radius:16px; padding:14px 16px;
    background:linear-gradient(135deg,#2a1a5e,#5b1a3a); border:1px solid rgba(255,255,255,.15); box-shadow:0 10px 40px rgba(0,0,0,.6);
    display:flex; gap:12px; align-items:center; animation:ban 3.2s forwards; }
  .banner .em { font-size:34px; } .banner b { display:block; font-size:15px; } .banner span { font-size:13px; color:rgba(255,255,255,.8); }
  @keyframes ban { 0%{transform:translateY(-130%)} 10%,85%{transform:translateY(0)} 100%{transform:translateY(-130%)} }
  .toast { position:fixed; left:50%; top:calc(var(--st) + 100px); transform:translateX(-50%); background:rgba(40,40,40,.95); padding:10px 16px;
    border-radius:10px; font-size:14px; z-index:50; animation:tst 1.6s forwards; white-space:nowrap; }
  @keyframes tst { 0%{opacity:0} 12%,80%{opacity:1} 100%{opacity:0} }
  .empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--muted); gap:10px; position:relative; z-index:2; }
  .empty b { color:#fff; font-size:24px; }
  .recap { display:flex; gap:22px; margin:10px 0; } .recap div { text-align:center; } .recap strong { display:block; font-size:24px; color:#fff; }
  .cta { margin-top:14px; padding:13px 26px; border-radius:10px; background:var(--red); color:#fff; font-weight:800; }

  /* ---------- top ---------- */
  #top { position:fixed; top:0; left:0; right:0; z-index:20; padding-top:calc(var(--st) + 8px); display:flex; align-items:center; }
  #top .side { width:58px; height:40px; flex:none; display:flex; align-items:center; justify-content:center; }
  #streak { font-weight:800; font-size:15px; display:flex; align-items:center; gap:2px; filter:grayscale(1) brightness(.8); }
  #streak.lit { filter:none; } #streak.danger { animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform:scale(1.15); } }
  #ring { position:relative; width:36px; height:36px; }
  #ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  #ring span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
  #tabs { flex:1; display:flex; gap:20px; overflow-x:auto; scrollbar-width:none; padding:0 6px; justify-content:safe center;
    mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent); }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; font-size:16px; font-weight:700; color:var(--muted); padding:8px 0 9px; position:relative; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .tab.active { color:#fff; }
  .tab.active::after { content:""; position:absolute; left:50%; bottom:2px; width:26px; height:3px; border-radius:2px; background:#fff; transform:translateX(-50%); }
  .tab .dot { position:absolute; top:6px; right:-8px; width:7px; height:7px; border-radius:50%; background:var(--red); }

  /* ---------- nav ---------- */
  #nav { position:fixed; left:0; right:0; bottom:0; z-index:30; height:calc(var(--nav) + var(--sb)); padding-bottom:var(--sb); background:#000; border-top:1px solid #1a1a1a; display:flex; }
  #nav button { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; color:var(--muted); position:relative; }
  #nav button.on { color:#fff; } #nav .ic { width:26px; height:26px; }
  #nav .plus { flex:none; width:64px; }
  .plusbtn { width:46px; height:30px; border-radius:9px; background:#fff; color:#000; box-shadow:-4px 0 0 var(--cyan), 4px 0 0 var(--red);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; }
  .badge { position:absolute; top:4px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--red); color:#fff; font-size:11px; font-weight:800; line-height:18px; }

  /* ---------- pages ---------- */
  .page { position:fixed; inset:0 0 calc(var(--nav) + var(--sb)) 0; background:#000; z-index:25; overflow-y:auto;
    padding:calc(var(--st) + 16px) 16px 30px; display:none; }
  .page.show { display:block; }
  .page h2 { font-size:18px; text-align:center; margin-bottom:18px; }
  .sect { font-size:13px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:24px 0 10px; }
  .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .tile { border-radius:16px; padding:16px; text-align:left; background:linear-gradient(135deg,var(--c1),var(--c2)); min-height:110px; display:flex; flex-direction:column; justify-content:space-between; }
  .tile .em { font-size:28px; } .tile b { font-size:17px; display:block; } .tile small { opacity:.85; font-size:12px; }
  .meter { height:5px; border-radius:3px; background:rgba(255,255,255,.25); margin-top:8px; overflow:hidden; } .meter i { display:block; height:100%; background:#fff; }
  .card2 { background:#121212; border-radius:16px; padding:16px; }
  .mission { display:flex; align-items:center; gap:12px; padding:14px; background:#121212; border-radius:14px; margin-bottom:10px; }
  .mission .em { font-size:26px; } .mission .t { flex:1; } .mission .t b { font-size:15px; display:block; margin-bottom:6px; }
  .mission .meter { background:#2a2a2a; margin:0; } .mission .meter i { background:linear-gradient(90deg,var(--cyan),var(--red)); }
  .mission .xp { font-size:12px; font-weight:800; color:var(--yellow); white-space:nowrap; }
  .mission.done { opacity:.55; } .mission.done .xp { color:var(--green); }
  .bigring { width:150px; height:150px; margin:6px auto 4px; position:relative; }
  .bigring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .bigring div { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .bigring b { font-size:34px; } .bigring span { font-size:12px; color:var(--muted); }
  .goals { display:flex; gap:8px; justify-content:center; margin-top:12px; }
  .goals button { padding:8px 14px; border-radius:999px; background:#1d1d1d; font-weight:700; font-size:14px; }
  .goals button.on { background:#fff; color:#000; }
  .prof { text-align:center; }
  .prof .big { width:92px; height:92px; border-radius:50%; margin:0 auto 10px; background:linear-gradient(135deg,var(--c1,#25f4ee),var(--c2,#fe2c55));
    display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:900; }
  .prof .handle { font-size:17px; font-weight:800; }
  .stats { display:flex; justify-content:center; gap:26px; margin:14px 0 8px; }
  .stats div { text-align:center; } .stats b { display:block; font-size:18px; } .stats span { font-size:12px; color:var(--muted); }
  .lvl { margin:10px auto 0; max-width:300px; font-size:13px; color:var(--muted); }
  .lvl .meter { background:#222; height:7px; } .lvl .meter i { background:linear-gradient(90deg,var(--cyan),var(--red)); }
  .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px; justify-content:center; }
  .heat i { width:12px; height:12px; border-radius:3px; background:#1c1c1c; }
  .heat i.l1 { background:#5b1a3a; } .heat i.l2 { background:#a3204f; } .heat i.l3 { background:var(--red); } .heat i.today { outline:1.5px solid #fff; }
  .badges { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .bdg { text-align:center; font-size:11px; color:var(--muted); }
  .bdg .em { width:58px; height:58px; margin:0 auto 5px; border-radius:50%; background:#1a1a1a; display:flex; align-items:center; justify-content:center; font-size:28px; filter:grayscale(1); opacity:.35; }
  .bdg.on { color:#fff; } .bdg.on .em { filter:none; opacity:1; background:radial-gradient(circle,#3a2a10,#1a1a1a); box-shadow:0 0 0 2px var(--yellow); }
  .rowbtn { width:100%; padding:14px; border-radius:12px; background:#161616; margin-top:10px; font-weight:700; }
  .rowbtn.danger { color:var(--red); }
  form label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }

// des jours manqués ? on les couvre avec des gels, s'il y en a assez
function applyGels(){
  const t = TODAY(); let last = t - 1;
  while (last > t - 400 && !active(last)) last--;
  const gap = (t - 1) - last;
  if (last <= t - 400 || gap <= 0 || gap > S.gels) return 0;
  for (let d = last + 1; d <= t - 1; d++) S.frozen[d] = 1;
  S.gels -= gap; save(); return gap;
}

const fx = $("fx"), ctx = fx.getContext("2d"); let parts = [], fxRun = false;
function confetti(n = 120){
  fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols = ["#fe2c55","#25f4ee","#face15","#ffffff","#7c5cff","#2fd27a"];
  for (let i = 0; i < n; i++) parts.push({ x:innerWidth/2 + (Math.random()-.5)*80, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4,
    s:Math.random()*7+4, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i % cols.length], life:0 });
  if (!fxRun) { fxRun = true; requestAnimationFrame(tick); }
}
function tick(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life < 140 && p.y < innerHeight + 40);
  for (const p of parts) { p.life++; p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - p.life/140); ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); }
  if (parts.length) requestAnimationFrame(tick); else { fxRun = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

// met à jour la répétition espacée + les compteurs (sans XP ni animations)
// g : 0 = raté, 1 = hésité, 2 = facile (true/false acceptés pour les quiz)
function srsApply(c, g){
  if (g === true) g = 2; if (g === false) g = 0;
  const id = idOf(c), r = S.srs[id] || { box:0, due:TODAY(), n:0, first:TODAY() };
  const wasKo = r.last === "ko";
  if (g === 2) { r.box = Math.min(r.box + 1, INTERVALS.length - 1); r.due = TODAY() + INTERVALS[r.box]; }
  else if (g === 1) { r.box = Math.max(1, r.box); r.due = TODAY() + Math.max(1, Math.round(INTERVALS[r.box] / 2)); }
  else { r.box = 1; r.due = TODAY(); }
  r.last = g === 0 ? "ko" : g === 1 ? "mid" : "ok"; r.n++; if (g === 0) r.ko = (r.ko || 0) + 1; S.srs[id] = r;
  S.total++; S.today.reviews++; S.days[TODAY()] = (S.days[TODAY()] || 0) + 1;
  if (!S.today.mats.includes(c.matiere)) S.today.mats.push(c.matiere);
  if (new Date().getHours() >= 23) S.badges.night = S.badges.night || "pending";
  if (g >= 1 && wasKo) S.today.rescued++;
  return wasKo;
}
function review(c, g, pt, viaQuiz){
  if (g === true) g = 2; if (g === false) g = 0;
  const lvlBefore = level(S.xp);
  srsApply(c, g);
  let gain;
  if (g >= 1) {
    combo++; S.today.maxCombo = Math.max(S.today.maxCombo, combo); S.bestCombo = Math.max(S.bestCombo, combo);
    const mult = Math.min(1 + Math.floor(combo / 5), 4);
    gain = (g === 2 ? (viaQuiz ? 15 : 10) : 6) * mult;
  } else { combo = 0; gain = 3; }                     // être honnête rapporte quand même
  S.xp += gain;
  if (pt) xpFloat(pt.x, pt.y, gain);
  showCombo();
  afterProgress(lvlBefore);
}
// objectif, missions, niveau, badges — après n'importe quel progrès
function afterProgress(lvlBefore){
  // objectif du jour
  if (!S.today.goalDone && S.today.reviews >= S.goal) {
    S.today.goalDone = true; confetti(160); buzz([30,40,30]);
    banner("target", "Objectif du jour atteint !", `${S.goal} révisions · série : ${streak()} jour${streak()>1?"s":""}`, true);
  }
  // missions
  const ms = todaysMissions();
  for (const m of ms) if (!m.done && m.cur >= m.goal) {
    S.today.missions.push(m.id);
    setTimeout(() => { banner(m.em, "Défi réussi", m.label, true); confetti(60); }, 700);
  }
  // les 3 défis du jour réussis = un gel de série offert
  if (ms.length && ms.every(m => S.today.missions.includes(m.id)) && !S.today.gelGiven) {
    S.today.gelGiven = true;
    if (S.gels < 3) { S.gels++; setTimeout(() => banner("snow", "Défis du jour terminés", `+1 gel de série (${S.gels}/3)`, true), 2000); }
  }
  save(); updateHud();
}

function buildList(){
  const F = currentFeed();
  if (F.build) { list = F.build(); return; }
  // ordre : à revoir (ko) → dues → nouvelles → le reste (par date de retour)
  // dans chaque groupe, les chapitres d'un CC proche passent devant
  const cls = c => isKo(c) ? 0 : isDue(c) ? 1 : isNew(c) ? 2 : 3;
  const later = c => rec(c) ? rec(c).due - TODAY() : 0;
  let cards = shuffle(ALL.filter(F.f)).sort((a,b) => cls(a) - cls(b) || ccBoost(b) - ccBoost(a) || later(a) - later(b));
  if (pinFirst) { const i = cards.findIndex(c => idOf(c) === pinFirst); if (i > 0) cards.unshift(cards.splice(i,1)[0]); pinFirst = null; }
  // un quiz toutes les 4 cartes
  list = [];
  cards.forEach((c, i) => {
    list.push({ c });
    if (i % 4 === 3) { const q = makeQuiz(cards[Math.max(0, i - 2 - (Math.random()*2|0))]); if (q) list.push(q); }
  });
  // les vidéos du feed : une pas encore vue tout de suite après la 1re carte, les autres toutes les 6 slides
  if (F.key !== "schemas" && F.key !== "revoir" && F.key !== "favs") {
    const vids = shuffle(VIDS.filter(v => F.f(v))).sort((a, b) => !!S.seenVids[a.src] - !!S.seenVids[b.src]);
    vids.forEach((v, k) => list.splice(Math.min(list.length, k === 0 && !S.seenVids[v.src] ? 1 : 1 + 6 * (k + 1)), 0, { vid:v }));

}
// 3 sortes de quiz : « C'est quoi ? » (déf → mot), « Complète » (trous), « Vrai ou faux »
const CLOZE = /\{\{([\s\S]*?)\}\}/;
// « C'est quoi ? » seulement pour les cartes dont la question est un mot / une notion courte
const shortQ = c => !/\?/.test(c.q) && plain(c.q).split(/\s+/).filter(Boolean).length <= 7;
function quizKinds(c){
  const pool = ALL.filter(x => x !== c && x.matiere === c.matiere && shortQ(x)), others = pool.length >= 2 ? pool : ALL.filter(x => x !== c && shortQ(x));
  const k = [];
  if (vocFor(c) || (isTerm(c) && defPrompt(c) && others.filter(isTerm).length >= 2)) k.push("def");
  (c.trous || []).forEach((_, i) => k.push("trou:" + i));
  (c.vf || []).forEach((_, i) => k.push("vf:" + i));
  (c.trous || []).forEach((t, i) => { if (CLOZE.test(t.t) && (t.faux || []).length) k.push("tv:" + i); });   // phrase à trous en vrai/faux
  return k;
}
// cache les mots de la question dans la définition (sinon « C'est quoi ? » donne la réponse)
const STOPW = new Set("avec dans pour sans sous selon entre leur leurs cette ceux celle elle elles sont plus moins tres".split(" "));
const fold = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function maskTerm(a, q){
  const txt = plain(String(q).replace(/\$[^$]*\$/g, " "));
  const stems = [...new Set((txt.match(/[\p{L}\p{N}]+/gu) || []).filter(w => w.length >= 4 && !STOPW.has(fold(w))).map(w => fold(w).slice(0, Math.max(4, w.length - 2))))];
  const acr = (txt.match(/\b[A-Z][A-Z0-9]{1,3}\b/g) || []);
  if (!stems.length && !acr.length) return a;
  const MASK = '<span class="masq">•••</span>';
  return String(a).split(/(\$\$[\s\S]*?\$\$|\$[^$]*\$|<[^>]*>)/).map((seg, i) => i % 2 ? seg
    : seg.replace(/[\p{L}\p{N}]+/gu, w => (w.length >= 3 && stems.some(st => fold(w).startsWith(st))) || acr.includes(w) ? MASK : w)).join("");
}
// « C'est quoi ? » : seulement la première phrase de la définition, si elle est courte
function shortDef(a){
  let t = String(a || "").split(/<p>|<br\s*\/?>/i)[0].replace(/\b(ex|cf|etc|env|vs|resp)\.(\s)/gi, "$1\u0007$2");   // « ex. » ne termine pas la phrase
  const m = t.match(/^((?:[^$.]|\$[^$]*\$|\.(?=\S))*?\.)(\s|$)/);   // jusqu'au premier point (hors formules)
  if (m) t = m[1];
  const len = plain(t).length;
  if (len > 150) { const c2 = t.search(/ : | ; |, (?=[a-zà-ÿ]{3,} )/); if (c2 > 40 && plain(t.slice(0, c2)).length <= 150) t = t.slice(0, c2); else return null; }
  t = t.replace(/\u0007/g, ".");
  const pt = plain(t).trim();
  if (/^(•|\d+\s*[).]|[-–])/.test(pt) || /:\s*$/.test(pt)) return null;      // un morceau de liste, pas une définition
  return pt.length >= 18 ? t : null;
}
// une phrase à trous transformée en affirmation vraie (bonne réponse) ou fausse (un leurre)
// « de absorption » → « d'absorption », « le ocytocine » → « l'ocytocine » après remplacement d'un trou
const elide = t => String(t).replace(/(^|[\s(«])([Dd]e|[Ll]e|[Ll]a|[Qq]ue|[Nn]e|[Ss]e)\s+(?=(?:<[^>]+>)*[aeiouyhàâéèêëîïôöûüœæAEIOUYÀÂÉÈÊÎÔŒ])/g, (m, a, w) => a + w.charAt(0) + "'");
window.elide = elide;
function trouStatement(tr, truth){
  const ans = (tr.t.match(CLOZE) || [, ""])[1], f = tr.faux[Math.random() * tr.faux.length | 0];
  return truth ? { t:elide(tr.t.replace(CLOZE, () => ans)), why:`<b>Vrai.</b> C'est bien « ${ans} ».` }
               : { t:elide(tr.t.replace(CLOZE, () => f)), why:`<b>Faux.</b> Il fallait « ${ans} », pas « ${f} ».` };
}
// « Quel mot correspond ? » : seulement pour un vrai mot de cours (pas un titre de chapitre comme « Plèvre et pressions »)
function isTerm(c){
  const q = plain(c.q).trim(), w = q.split(/\s+/).filter(Boolean);
  if (c.type !== "def" || w.length > 4 || /[?:;,()]|\bet\b|\bvs\b|\bou\b|^(les|des|ce|comment|pourquoi|quand)\b|\d/i.test(q)) return false;
  return true;
}
// la définition d'une carte, sans le mot lui-même et seulement si elle se lit bien
function defPrompt(c){
  const sd = shortDef(c.a); if (!sd || /\$\$|·/.test(sd)) return null;
  let t = maskTerm(sd, c.q).replace(/^\s*(<span class="masq">•••<\/span>[\s-]*)+\s*[:=]\s*/, "");
  const n = (t.match(/class="masq"/g) || []).length, pl = plain(t).trim();
  if (n > 1 || pl.length < 25 || /^[•\d]/.test(pl) || (pl.match(/\d/g) || []).length > 6) return null;
  return t.charAt(0).toUpperCase() + t.slice(1);
}
// le mot de la carte dans le vocabulaire de l'onglet Mots (définitions courtes et propres)
function vocFor(c){
  const V = (window.EXOS && EXOS.vocab) || [], q = fold(plain(c.q)).replace(/^(le|la|les|l')\s*/, "").trim();
  return V.find(v => v.matiere === c.matiere && fold(v.w) === q) || V.find(v => v.matiere === c.matiere && v.chapitre === c.chapitre && q.length > 3 && fold(v.w).replace(/^(le|la|les|l')\s*/, "") === q) || null;
}
function makeQuiz(c, kind){
  if (kind === "cours") return { quiz:true, kind, c, cours:true, head:"Énonce", prompt:c.q, opts:[], cle:c.cle || null, explain:null };
  const kinds = quizKinds(c); if (!kinds.length) return null;
  if (!kind) {                                       // les trous / vrai-faux sortent plus souvent : plus variés
    const tr = kinds.filter(k => k.startsWith("trou:")), vfk = kinds.filter(k => /^(vf|tv):/.test(k)), cats = [];
    if (tr.length) cats.push(tr); if (vfk.length) cats.push(vfk);
    if (cats.length && (Math.random() < 0.7 || !kinds.includes("def"))) {
      const cat = cats[Math.random() * cats.length | 0];
      const canTrue = vfk.some(k => k.startsWith("tv:") || (k.startsWith("vf:") && c.vf[+k.split(":")[1]].v));
      const other = cats.find(x => x !== vfk);
      if (cat === vfk && !canTrue && Math.random() < 0.8) {
        // carte sans affirmation vraie : on évite que la réponse soit toujours « Faux »
        kind = other ? other[Math.random() * other.length | 0] : kinds.includes("def") ? "def" : vfk[Math.random() * vfk.length | 0];
      } else if (cat === vfk) {
        // vrai/faux équilibré : on tire d'abord « vrai » ou « faux », puis une affirmation qui l'est
        const want = Math.random() < 0.5;
        const fixed = vfk.filter(k => k.startsWith("vf:") && !!c.vf[+k.split(":")[1]].v === want), tv = vfk.filter(k => k.startsWith("tv:"));
        const pool2 = [...fixed, ...tv];
        if (pool2.length) { const k = pool2[Math.random() * pool2.length | 0]; if (k.startsWith("tv:")) return tvQuiz(c, k, want); kind = k; }
        else kind = vfk[Math.random() * vfk.length | 0];
      } else kind = cat[Math.random() * cat.length | 0];
    } else kind = kinds.includes("def") ? "def" : kinds[Math.random() * kinds.length | 0];
  }
  const [type, n] = kind.split(":");
  if (type === "tv") return tvQuiz(c, kind, Math.random() < 0.6);
  if (type === "def") {
    const v = vocFor(c), V = (window.EXOS && EXOS.vocab) || [];
    if (v) {   // définition propre de l'onglet Mots, leurres = autres mots du même chapitre
      const near = V.filter(o => o !== v && o.matiere === v.matiere && o.chapitre === v.chapitre && o.d !== v.d), far = V.filter(o => o !== v && o.matiere === v.matiere && o.chapitre !== v.chapitre);
      const wrong = [...shuffle(near.slice()), ...shuffle(far.slice())].slice(0, 2);
      if (wrong.length === 2) return { quiz:true, kind, c, head:"Quel mot correspond ?", prompt:v.d + ".", opts:shuffle([{ h:v.w, ok:true }, ...wrong.map(o => ({ h:o.w, ok:false }))]), explain:`<b>${esc(v.w)}</b> : ${esc(v.d)}.` };
    }
    const dp = defPrompt(c); if (!dp || !isTerm(c)) return null;
    const terms = ALL.filter(x => x !== c && x.matiere === c.matiere && isTerm(x) && fold(x.q) !== fold(c.q));
    const near = terms.filter(o => o.chapitre === c.chapitre), far = terms.filter(o => o.chapitre !== c.chapitre);
    const wrong = [...shuffle(near.slice()), ...shuffle(far.slice())].slice(0, 2); if (wrong.length < 2) return null;
    const opts = shuffle([c, ...wrong]).map(o => ({ h:o.q, ok:o === c }));
    return { quiz:true, kind, c, head:"Quel mot correspond ?", prompt:dp, opts, explain:null };
  }
  if (type === "trou") {
    const tr = c.trous[+n], ans = (tr.t.match(CLOZE) || [,""])[1];
    return { quiz:true, kind, c, head:"Complète", prompt:tr.t.replace(CLOZE, '<span class="blank">?</span>'),
      opts:shuffle([{ h:ans, ok:true }, ...shuffle(tr.faux.slice()).slice(0, 2).map(f => ({ h:f, ok:false }))]),
      explain:tr.t.replace(CLOZE, '<b class="hl">$1</b>') };
  }
  const v = c.vf[+n];
  return { quiz:true, kind, c, head:"Vrai ou faux ?", prompt:v.t, vf:true,
    opts:[{ h:"Vrai", ok:v.v === true }, { h:"Faux", ok:v.v === false }],
    explain:`<b>${v.v ? "Vrai" : "Faux"}.</b> ${v.pourquoi || ""}` };
}
function tvQuiz(c, kind, truth){
  const st = trouStatement(c.trous[+kind.split(":")[1]], truth);

}

/* ---- interactions ---- */
let lastTap = 0, tapTimer = null;
feedEl.addEventListener("click", e => {
  if (typeof exoClick === "function" && exoClick(e)) return;
  if (typeof plusClick === "function" && plusClick(e)) return;
  if (e.target.closest("[data-act=again]")) { renderFeed(false); return; }
  const qs = e.target.closest(".slide[data-quiz]");
  if (qs) { const o = e.target.closest(".qopt"); if (o) answerQuiz(qs, o, e); return; }
  const slide = e.target.closest(".slide[data-id]"); if (!slide) return;
  const btn = e.target.closest("[data-act]");
  const c = byId(slide.dataset.id);
  if (btn) {
    const a = btn.dataset.act;
    if (a === "flip") { slide.classList.toggle("flipped"); Sound.SFX.flip(); }
    else if (a === "music") toggleMusic();
    else if (a === "comments") openComments(c);
    else if (a === "demo") openDemo(c);
    else if (a === "acct") openAcct(c.matiere);
    else if (a === "fav") setFav(slide, c, !isFav(c), e);
    else if (a === "read") readCard(c, btn);
    return;
  }
  const gb = e.target.closest("[data-g]"); if (gb) { rate(slide, c, +gb.dataset.g, e); return; }
  if (e.target.closest(".back") && !e.target.closest("[data-act]")) return;   // on peut sélectionner le texte du verso
  const now = Date.now();
  if (now - lastTap < 280) { clearTimeout(tapTimer); lastTap = 0; setFav(slide, c, true, e); return; }   // double tap = favori, comme un « j'aime »
  lastTap = now;
  tapTimer = setTimeout(() => { slide.classList.toggle("flipped"); Sound.SFX.flip(); }, 280);
});

function rate(slide, c, g, ev){
  if (slide.dataset.done) { toast("Déjà notée"); return; }
  slide.dataset.done = 1;
  review(c, g, { x: ev.clientX, y: ev.clientY - 20 });
  g >= 1 ? Sound.SFX.ok(combo) : Sound.SFX.ko();
  slide.querySelectorAll("[data-g]").forEach(b => b.classList.toggle("picked", +b.dataset.g === g));
  slide.querySelector(".mast").innerHTML = `Maîtrise <b>${dots(box(c))}</b> · ${dueTxt(c)}`;
  if (g === 0) toast("Elle revient dans « À revoir »", "bookmark"); else buzz(12);
  setTimeout(() => feedEl.scrollBy({ top: feedEl.clientHeight, behavior:"smooth" }), 600);
}
function setFav(slide, c, on, ev){
  const id = idOf(c);
  if (on) S.favs[id] = TODAY(); else delete S.favs[id];
  save(); checkBadges();
  const b = slide.querySelector("[data-act=fav]"); if (b) b.classList.toggle("on-ok", on);
  if (on) {
    const r = slide.getBoundingClientRect(), h = document.createElement("div");
    h.className = "heart"; h.innerHTML = ICON.heart; h.style.setProperty("--r", (Math.random()*40-20) + "deg");
    h.style.left = (ev.clientX - r.left) + "px"; h.style.top = (ev.clientY - r.top) + "px";
    slide.appendChild(h); setTimeout(() => h.remove(), 900); buzz(12); Sound.SFX.tap();
  }
}
function answerQuiz(slide, opt, ev){
  if (slide.dataset.done) return; slide.dataset.done = 1;
  const good = opt.dataset.ans === "1", c = byId(slide.dataset.quiz);
  slide.querySelectorAll(".qopt").forEach(o => {
    if (o.dataset.ans === "1") o.classList.add("good");
    o.querySelector(".pct").textContent = o.dataset.ans === "1" ? "✓" : "";
  });
  if (!good) opt.classList.add("bad");
  const exp = slide.querySelector(".qexp"); if (exp) exp.hidden = false;
  if (good) { S.quizOk++; S.today.quizOk++; confetti(50); buzz(15); } else buzz([40,30,40]);
  review(c, good, { x: ev.clientX, y: ev.clientY - 20 }, true);
  good ? Sound.SFX.quizOk() : Sound.SFX.quizKo();
  if (good) setTimeout(() => feedEl.scrollBy({ top: feedEl.clientHeight, behavior:"smooth" }), exp ? 1800 : 1000);
  else if (!exp) setTimeout(() => feedEl.scrollBy({ top: feedEl.clientHeight, behavior:"smooth" }), 1700);
  else { const h = document.createElement("div"); h.className = "qnext"; h.textContent = "Lis l'explication, puis scrolle ↓"; slide.querySelector(".qbox").appendChild(h); }
}

function switchFeed(i){
  hidePages(); closeAcct();
  if (i === cur) { feedEl.scrollTo({ top:0, behavior:"smooth" }); setNav(cur === -1 ? "revoir" : "home"); return; }
  const dir = (cur < 0 || i > cur) ? "l" : "r"; Sound.SFX.swoosh();
  cur = i; setNav(i === -1 ? "revoir" : "home");
  feedEl.classList.add("out-" + dir);
  setTimeout(() => {
    feedEl.classList.remove("out-" + dir); feedEl.classList.add("in-" + dir);
    renderFeed(!pinFirst);
    requestAnimationFrame(() => requestAnimationFrame(() => feedEl.classList.remove("in-" + dir)));
  }, 200);
}
function swipe(el, onLeft, onRight){
  let sx = 0, sy = 0, st = 0;
  el.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive:true });
  el.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st < 600) (dx < 0 ? onLeft : onRight)();
  }, { passive:true });
}
const visibleSlide = () => feedEl.children[Math.round(feedEl.scrollTop / feedEl.clientHeight)];
// glisser vers la gauche → compte de la matière ; vers la droite → feed précédent
swipe(feedEl, () => { const s = visibleSlide(), id = s && (s.dataset.id || s.dataset.quiz);
                  if (id) openAcct(byId(id).matiere); else if (s && s.dataset.vid) { const it = VIDS.find(x => x.src === s.dataset.vid); if (it) openAcct(it.matiere); } },
              () => { if (cur > 0) switchFeed(cur - 1); else if (cur < 0) switchFeed(1); });
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;   // on écrit : ne rien intercepter
  if ($("acct").classList.contains("show")) { if (e.key === "ArrowRight" || e.key === "Escape") closeAcct(); return; }
  if (e.key === "ArrowLeft") { const s = visibleSlide(), id = s && (s.dataset.id || s.dataset.quiz); if (id) openAcct(byId(id).matiere); }
  if (e.key === "ArrowRight" && cur >= 0 && cur < feeds.length-1) switchFeed(cur+1);
  if (e.key === "ArrowDown") feedEl.scrollBy({ top:feedEl.clientHeight, behavior:"smooth" });
  if (e.key === "ArrowUp") feedEl.scrollBy({ top:-feedEl.clientHeight, behavior:"smooth" });
  if (e.key === " ") { const s = visibleSlide(); if (s && s.dataset.id) { s.classList.toggle("flipped"); Sound.SFX.flip(); } e.preventDefault(); }
});

function goalNow(){

let RUN = null;
function startExam(){

  const picked = [], seenCard = new Set();
  for (const ck of all) if (!seenCard.has(idOf(ck[0]))) { picked.push(ck); seenCard.add(idOf(ck[0])); }   // d'abord une question par carte
  for (const ck of all) if (picked.length < EX.n && !picked.includes(ck)) picked.push(ck);
  const qs = picked.slice(0, EX.n).map(([c, k]) => makeQuiz(c, k));
  RUN = { qs, i:0, ans:qs.map(() => null), shown:qs.map(() => false), ticks:qs.map(() => []), t0:Date.now(), end: EX.min ? Date.now() + EX.min * 60000 : null, timer:null, done:false };
  hidePages(); $("exam").classList.add("show"); Sound.SFX.swoosh();
  RUN.timer = setInterval(tickExam, 500); renderExam();
}

  if (RUN.end) { const left = RUN.end - Date.now(); el.innerHTML = ic("timer", 16) + " " + fmt(left); el.classList.toggle("low", left < 60000); if (left <= 0) { toast("Temps écoulé !", "alarm"); finishExam(); } }
  else el.innerHTML = ic("timer", 16) + " " + fmt(Date.now() - RUN.t0);
}

  const cl = e.target.closest("[data-cle]"), sf = e.target.closest("[data-self]");
  if (b && b.dataset.x === "reveal") { const q = RUN.qs[RUN.i]; RUN.shown[RUN.i] = true; RUN.ans[RUN.i] = q.cle ? 0 : null; Sound.SFX.flip(); renderExam(); return; }
  if (cl) { const j = +cl.dataset.cle, t = RUN.ticks[RUN.i]; t.includes(j) ? t.splice(t.indexOf(j), 1) : t.push(j);

      <button class="reveal" data-x="reveal">${ic("eye", 18)} Voir la réponse</button>`
    : `<div class="ansbox">${prep(c.a)}</div>
      ${q.cle ? `<div class="note" style="margin:0 0 8px">Coche ce que tu avais bien écrit :</div><div class="clist">${q.cle.map((k, j) => `<button class="cle ${RUN.ticks[i].includes(j) ? "on" : ""}" data-cle="${j}"><span class="bx">${RUN.ticks[i].includes(j) ? ic("check", 16, "#000") : ""}</span><span>${prep(k)}</span></button>`).join("")}</div>`
              : `<div class="note" style="margin:0 0 8px">Tu l'avais ?</div><div class="selfg">${[[1,"Tout bon"],[0.5,"À moitié"],[0,"Raté"]].map(([v, t]) => `<button data-self="${v}" class="${RUN.ans[i] === v ? "sel" : ""}">${t}</button>`).join("")}</div>`}`}`;
}
function closeExam(){ if (RUN) clearInterval(RUN.timer); RUN = null; $("exam").classList.remove("show"); setNav("home"); }
function finishExam(){
  RUN.done = true; clearInterval(RUN.timer);
  const qs = RUN.qs;
  // score de chaque question : 0 ou 1 pour les QCM, une fraction pour les questions de cours
  const pts = qs.map((q, k) => RUN.ans[k] === null ? 0 : q.cours ? RUN.ans[k] : (q.opts[RUN.ans[k]].ok ? 1 : 0));
  const ok = pts.map(x => x >= 0.99), nOk = Math.round(pts.reduce((a, x) => a + x, 0) * 10) / 10;
  const note = Math.round(nOk / qs.length * 40) / 2, sec = Math.round((Date.now() - RUN.t0) / 1000);
  const lvlBefore = level(S.xp);
  qs.forEach((q, k) => srsApply(q.c, pts[k] >= 0.99 ? 2 : pts[k] >= 0.5 ? 1 : 0));
  const gain = Math.round(nOk * 8) + (note >= 16 ? 60 : note >= 10 ? 25 : 0);
  S.xp += gain; S.today.exams = (S.today.exams || 0) + 1; S.quizOk += nOk; S.today.quizOk += nOk;
  S.exams = [...(S.exams || []), { d:TODAY(), mats:[...new Set(qs.map(q => q.c.matiere))], n:qs.length, ok:nOk, note, sec }].slice(-30);
  afterProgress(lvlBefore); save(); updateHud();
  const em = note >= 18 ? "trophy" : note >= 14 ? "flame" : note >= 10 ? "thumb" : "trend";
  $("exam").innerHTML = `
    <div class="ohead"><button class="x" data-x="close">×</button><div class="tt">Résultat du contrôle</div></div>
    <div class="result">
      <div class="note20"><div>${ic(em, 44, noteColor(note))}</div><b style="color:${noteColor(note)}">${String(note).replace(".", ",")}</b><span> / 20</span>
        <div>${String(nOk).replace(".", ",")}/${qs.length} points · ${fmt(sec * 1000)}</div></div>
      ${qs.map((q, k) => { const a = RUN.ans[k], good = q.opts.find(o => o.ok);
        if (q.cours) return `<div class="corr ${ok[k] ? "" : "ko"}"><div class="q">${ic(ok[k] ? "ok" : "ko", 18, ok[k] ? "#2fd27a" : pts[k] >= 0.5 ? "#face15" : "#fe2c55")} <b>Énonce</b> ${prep(q.c.q)}</div>
          <div class="a">${a === null ? "<i>Pas répondu</i>" : q.cle ? `Points clés : <b>${RUN.ticks[k].length}/${q.cle.length}</b>` : `Auto-évaluation : <b>${a === 1 ? "tout bon" : a === 0.5 ? "à moitié" : "raté"}</b>`}</div>
          ${!ok[k] ? `<div class="e">${prep(q.c.a)}</div>` : ""}</div>`;
        return `<div class="corr ${ok[k] ? "" : "ko"}"><div class="q">${ic(ok[k] ? "ok" : "ko", 18, ok[k] ? "#2fd27a" : "#fe2c55")} <b>${esc(q.head)}</b> ${prep(q.prompt)}</div>
          <div class="a">${a === null ? "<i>Pas de réponse</i>" : `Ta réponse : <b>${prep(q.opts[a].h)}</b>`}${ok[k] ? "" : `<br>Bonne réponse : <b>${prep(good.h)}</b>`}</div>
          ${!ok[k] && q.explain ? `<div class="e">${prep(q.explain)}</div>` : ""}</div>`; }).join("")}
    </div>
    <div class="ofoot">${ok.some(x => !x) ? `<button data-x="revoir"><span class="ico-row">${ic("bookmark", 17)} Revoir les erreurs</span></button>` : ""}<button class="main" data-x="close">Terminer</button></div>`;
  math($("exam"));
  if (note >= 16) { confetti(200); Sound.SFX.fanfare(); } else if (note >= 10) { confetti(70); Sound.SFX.quizOk(); } else Sound.SFX.ko();
}
